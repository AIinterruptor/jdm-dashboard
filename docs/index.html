<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>State of the Nation PH — moved</title>

<!-- This page exists only to forward old links.
     jdm-dashboard was originally published here on GitHub Pages. The site now
     lives at newsph.jdmaisolutions.com, and this copy was a stale snapshot: it
     had none of the prediction board, money page or subscription, so anyone
     landing here was seeing a worse version of the product.
     GitHub Pages is repointed at /docs so the repository root (the real
     application, deployed to Cloudflare) is no longer served publicly. -->
<link rel="canonical" href="https://newsph.jdmaisolutions.com/">
<meta http-equiv="refresh" content="0; url=https://newsph.jdmaisolutions.com/">
<meta name="robots" content="noindex, follow">

<style>
  :root{ --paper:#faf7f2; --ink:#12100e; --grey:#6b6560; --red:#c8102e; --rule:#d9d2c7; }
  *{ box-sizing:border-box; }
  body{ margin:0; min-height:100vh; display:grid; place-items:center; padding:28px;
        background:var(--paper); color:var(--ink);
        font-family:'Source Serif 4',Georgia,'Times New Roman',serif; }
  main{ max-width:34rem; text-align:center; }
  h1{ margin:0 0 6px; font-size:clamp(30px,7vw,46px); line-height:1.04; letter-spacing:-.02em;
      font-weight:700; text-wrap:balance; }
  h1 em{ font-style:italic; color:var(--red); }
  .rule{ height:2px; background:var(--ink); margin:18px auto; max-width:9rem; }
  p{ margin:0 0 16px; font-size:17px; line-height:1.6; color:#3a352f; }
  .small{ font-size:13px; color:var(--grey);
           font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
  a.go{ display:inline-block; margin-top:6px; padding:13px 26px; text-decoration:none;
        background:var(--ink); color:var(--paper); font-weight:600; font-size:15px;
        font-family:ui-monospace,SFMono-Regular,Menlo,monospace; letter-spacing:.04em; }
  a.go:hover{ background:var(--red); }
  a.plain{ color:var(--red); }
  @media (prefers-color-scheme: dark){
    :root{ --paper:#12100e; --ink:#f2ede4; --grey:#9b958c; --rule:#332f29; }
    p{ color:#cfc8bd; }
    a.go{ background:var(--ink); color:#12100e; }
  }
</style>
</head>
<body>
<main>
  <h1>State of the <em>Nation</em></h1>
  <div class="rule"></div>
  <p>This address has moved. The bulletin, the prediction board and the money
     page are now published at <strong>newsph.jdmaisolutions.com</strong>.</p>
  <p><a class="go" href="https://newsph.jdmaisolutions.com/">Go to the site &rarr;</a></p>
  <p class="small">If you are not redirected automatically, use the link above.<br>
     <a class="plain" href="https://github.com/AIinterruptor/jdm-dashboard">Source repository</a></p>
</main>
<script>
  // Belt and braces: the meta refresh covers most cases, but replace() also
  // keeps the dead URL out of the visitor's back-button history.
  location.replace('https://newsph.jdmaisolutions.com/');
</script>
</body>
</html>
