name = "jdm-proxy"
main = "index.js"
compatibility_date = "2024-09-01"

[vars]
# Comma-separated list of allowed browser origins (prefix match). First entry is the fallback.
# aiinterruptor.github.io and josed.github.io removed 2026-09-10: the GitHub
# Pages mirror is retired and now only redirects. Leaving them here was a
# standing grant to EVERY page on those GitHub accounts — not just this repo —
# including the unauthenticated prediction-vote endpoint.
# state-of-the-nationph.pages.dev must STAY: it is the Cloudflare Pages origin
# that newsph.jdmaisolutions.com is actually served from.
ALLOWED_ORIGINS = "https://state-of-the-nationph.pages.dev,https://newsph.jdmaisolutions.com,http://localhost,http://127.0.0.1"
# Soft per-IP limit per minute. One dashboard refresh is ~130 requests over 2 minutes.
RATE_LIMIT = "300"
MAX_RESPONSE_SIZE = "5242880"

# Secrets are set via `wrangler secret put <NAME>` (never committed):
#   wrangler secret put FIRMS_KEY
#   wrangler secret put TAVILY_KEY

[[kv_namespaces]]
binding = "JDM_KV"
id = "6d8b5ecaf053453eb510f14cc26052ae"

# Prediction board. D1 rather than KV because votes are concurrent appends —
# a KV counter is read-modify-write and drops them.
[[d1_databases]]
binding = "PRED_DB"
database_name = "newsph-predictions"
database_id = "a280b4a4-9f86-4692-b632-1360f7d870c2"

[triggers]
# every 30 min: collect feeds into KV. 22:05 UTC = 06:05 PHT and 10:05 UTC = 18:05 PHT: collect + Haiku brief.
crons = ["*/30 * * * *", "5 22 * * *", "5 10 * * *"]
